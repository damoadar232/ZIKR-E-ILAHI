spring.application.name=zikrelahi-api
server.port=${PORT:8080}

# Database — MySQL localhost (development); override via environment variables in production
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/zikr}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:orcl}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# JWT — IMPORTANT: override JWT_SECRET in production with a min 256-bit random value
app.jwt.secret=${JWT_SECRET:dev-only-secret-replace-in-production-must-be-long-enough-yes}
app.jwt.access-expiry-seconds=${JWT_ACCESS_EXPIRY_SECONDS:3600}
app.jwt.refresh-expiry-seconds=${JWT_REFRESH_EXPIRY_SECONDS:2592000}

# CORS — comma-separated list of allowed origins, no trailing slashes
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8443}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Default admin seed — AdminUserSeeder only runs when profile != prod
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@zikrelahi.dev}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:ChangeMe123!}
